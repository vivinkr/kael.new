
name: Build KAEL Music APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KAEL_Music_Build_Package.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          find extracted -name settings.gradle -o -name settings.gradle.kts
          echo "Files extracted."

      - name: Build APK
        run: |
          PROJECT=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)
          if [ -z "$PROJECT" ] || [ "$PROJECT" = "extracted" ]; then
            echo "ERROR: Could not find the Android project root."
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          cd "$PROJECT"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KAEL-Music-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
